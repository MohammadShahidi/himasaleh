<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
html,body{margin:0;padding:0;background:#fff;}
*{box-sizing:border-box;}
body{font-family:'Vazirmatn',Tahoma,sans-serif;color:#1a1a1a;}
a{color:inherit;text-decoration:none;}
a:hover{color:#FF5B0F;}
[data-bento] > *:nth-child(-n+2){grid-column:span 3;}
[data-bento] > *:nth-child(n+3){grid-column:span 2;}
[data-bento] > *:nth-child(-n+2) [data-bcard]{min-height:440px;}
[data-bcard] [data-arrow]{transition:all .5s cubic-bezier(.2,.8,.2,1);}
[data-bcard]:hover [data-arrow]{background:#FF5B0F !important;border-color:#FF5B0F !important;transform:rotate(-45deg);}
[data-subchip]{transition:all .3s;}
[data-subchip]:hover{background:#FF5B0F !important;border-color:#FF5B0F !important;color:#fff !important;}
[data-step]:hover [data-step-n]{background:#FF5B0F !important;color:#fff !important;transform:scale(1.08);}
[data-step-n]{transition:all .45s cubic-bezier(.2,.8,.2,1);}
@media (max-width:900px){[data-bento]{grid-template-columns:1fr !important;}[data-bento] > *{grid-column:auto !important;}[data-bento] > * [data-bcard]{min-height:380px !important;}[data-steps]{grid-template-columns:repeat(2,minmax(0,1fr)) !important;}}
@media (max-width:520px){[data-steps]{grid-template-columns:1fr !important;}}
</style>
</helmet>
<div dir="rtl" style="font-family:'Vazirmatn',Tahoma,sans-serif;background:#fff;min-width:0;overflow-x:clip;">
  <dc-import name="SiteHeader" active="categories" hint-size="100%,0px"></dc-import>
  <dc-import name="PageHero" title="دسته‌بندی محصولات" crumb="دسته‌بندی‌ها" subtitle="پنج گروه اصلی مصالح ساختمانی، از سفت‌کاری تا تاسیسات؛ دسته مورد نظر را انتخاب کنید و مستقیم به زیرگروه‌ها بروید." img="assets/c3.jpg" hint-size="100%,520px"></dc-import>

  <section data-wrap="" data-screen-label="Categories" style="max-width:1280px;margin:0 auto;padding:70px 40px 0;">
    <div data-bento="" style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:22px;">
      <sc-for list="{{ cats }}" as="c" hint-placeholder-count="5">
        <div data-reveal="" data-delay="{{ $index }}">
          <div data-card="" data-bcard="" style="position:relative;height:100%;min-height:380px;border-radius:24px;overflow:hidden;background:#1a1a1a;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 16px 40px rgba(0,0,0,.12);">
            <div data-zoom="" style="position:absolute;inset:0;background-image:url('{{ c.img }}');background-size:cover;background-position:center;"></div>
            <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(14,14,14,.96) 18%,rgba(14,14,14,.55) 55%,rgba(14,14,14,.1));"></div>
            <a href="{{ c.href }}" aria-label="{{ c.name }}" style="position:absolute;inset:0;z-index:1;"></a>
            <div style="position:absolute;top:22px;right:22px;left:22px;z-index:2;display:flex;align-items:center;justify-content:space-between;pointer-events:none;">
              <span style="width:54px;height:54px;border-radius:16px;background:rgba(255,255,255,.14);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;color:#FF7A3A;"><i class="ti ti-{{ c.icon }}" style="font-size:28px;"></i></span>
              <span data-arrow="" style="width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;color:#fff;"><i class="ti ti-arrow-left" style="font-size:20px;"></i></span>
            </div>
            <div style="position:relative;z-index:2;padding:26px;pointer-events:none;">
              <div style="font-size:13px;font-weight:700;color:#FF7A3A;">{{ c.meta }}</div>
              <h2 style="margin:8px 0 0;font-size:clamp(22px,2.2vw,28px);font-weight:900;">{{ c.name }}</h2>
              <p style="margin:10px 0 0;font-size:14px;line-height:1.9;color:#D0D0D0;max-width:420px;">{{ c.desc }}</p>
              <div style="margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;pointer-events:auto;">
                <sc-for list="{{ c.subs }}" as="s" hint-placeholder-count="4">
                  <a data-subchip="" href="{{ s.href }}" style="font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.1);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);padding:7px 13px;border-radius:999px;">{{ s.label }}</a>
                </sc-for>
              </div>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
  </section>

  <section data-wrap="" style="max-width:1280px;margin:0 auto;padding:96px 40px 0;text-align:center;">
    <div data-reveal="" style="display:inline-flex;color:#FF5B0F;font-size:14px;font-weight:700;background:#FFF0E8;padding:7px 16px;border-radius:999px;">مراحل سفارش</div>
    <h2 data-reveal="" data-delay="1" style="margin:18px 0 0;font-size:clamp(26px,3vw,36px);font-weight:900;color:#141414;">از انتخاب تا تحویل در کارگاه</h2>
    <div data-steps="" style="margin-top:50px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;text-align:right;">
      <sc-for list="{{ steps }}" as="st" hint-placeholder-count="4">
        <div data-reveal="" data-delay="{{ $index }}">
          <div data-step="" style="height:100%;background:#FAFAFA;border:1px solid #F0F0F0;border-radius:20px;padding:26px;transition:all .45s cubic-bezier(.2,.8,.2,1);" style-hover="background:#fff;box-shadow:0 20px 44px rgba(0,0,0,.08);transform:translateY(-6px);">
            <div data-step-n="" style="width:52px;height:52px;border-radius:15px;background:#FFF0E8;color:#FF5B0F;display:flex;align-items:center;justify-content:center;"><i class="ti ti-{{ st.icon }}" style="font-size:26px;"></i></div>
            <div style="margin-top:18px;font-size:13px;font-weight:800;color:#FF5B0F;">مرحله {{ st.n }}</div>
            <div style="margin-top:6px;font-size:18px;font-weight:800;color:#141414;">{{ st.title }}</div>
            <div style="margin-top:8px;font-size:14px;line-height:1.9;color:#777;">{{ st.desc }}</div>
          </div>
        </div>
      </sc-for>
    </div>
  </section>

  <section data-wrap="" style="max-width:1280px;margin:0 auto;padding:70px 40px 0;">
    <div data-reveal="" onMouseMove="{{ spot }}" style="position:relative;overflow:hidden;border-radius:22px;background:radial-gradient(520px circle at var(--mx,20%) var(--my,50%),rgba(255,91,15,.18),transparent 45%),#181818;padding:40px clamp(24px,5vw,64px);display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;border:1px solid #262626;">
      <div>
        <div style="font-size:clamp(20px,2.2vw,28px);font-weight:900;color:#fff;">مطمئن نیستید کدام دسته مناسب پروژه شماست؟</div>
        <div style="margin-top:10px;font-size:15px;color:#BBB;">کارشناسان ما بر اساس نوع سازه، بهترین ترکیب مصالح را پیشنهاد می‌دهند.</div>
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;">
        <button data-btn="" onClick="{{ consult }}" style="border:none;background:#FF5B0F;color:#fff;font-size:16px;font-weight:800;padding:17px 28px;border-radius:12px;display:flex;align-items:center;gap:10px;white-space:nowrap;"><i class="ti ti-message-2" style="font-size:18px;"></i>درخواست مشاوره</button>
        <a data-btn="" href="products.dc.html" style="border:1.5px solid #fff;color:#fff;font-size:16px;font-weight:700;padding:16px 26px;border-radius:12px;display:flex;align-items:center;gap:10px;white-space:nowrap;" style-hover="background:#fff;color:#141414;">همه محصولات<i class="ti ti-chevron-left" style="font-size:17px;"></i></a>
      </div>
    </div>
  </section>

  <dc-import name="SiteFooter" hint-size="100%,420px"></dc-import>
  <dc-import name="ConsultModal" hint-size="0px,0px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const fa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
    const C = [
      ['cement', 'c1', 'package', 'سیمان و افزودنی‌ها', 'انواع سیمان پرتلند و سفید، چسب و ملات آماده و افزودنی‌های تخصصی بتن.', ['سیمان پرتلند', 'سیمان سفید', 'چسب و ملات', 'افزودنی بتن']],
      ['steel', 'c2', 'layout-columns', 'آهن آلات', 'میلگرد، تیرآهن، ناودانی، نبشی و ورق برای اسکلت و سازه‌های فلزی.', ['میلگرد', 'تیرآهن', 'ناودانی و نبشی', 'ورق و پروفیل']],
      ['brick', 'c3', 'wall', 'انواع آجر و بلوک', 'آجر فشاری و نما، سفال و بلوک‌های سیمانی و سبک.', ['آجر فشاری و نما', 'آجر سفال', 'بلوک سیمانی', 'بلوک سبک']],
      ['sand', 'c4', 'shovel', 'شن، ماسه و مصالح', 'ماسه شسته و بادی، شن دانه‌بندی‌شده، پوکه و گچ.', ['ماسه', 'شن', 'پوکه و گچ']],
      ['pipe', 'c5', 'tools', 'لوله و اتصالات', 'لوله‌های پلی‌اتیلن، پنج‌لایه و PVC به همراه اتصالات و شیرآلات.', ['لوله پلی‌اتیلن', 'لوله پنج‌لایه', 'لوله PVC', 'اتصالات و شیرآلات']]
    ];
    const CM = (() => { try { return JSON.parse(localStorage.getItem('hm_cms') || 'null'); } catch (e) { return null; } })();
    const CC = CM ? CM.categories.filter(c => c.on).map(c => [c.k, c.img, c.icon, c.name, c.desc || ((C.find(x => x[0] === c.k) || [])[4] || ''), c.subs]) : C;
    return {
      cats: CC.map(([k, img, icon, name, desc, subs]) => ({
        img: (String(img).includes('/') || String(img).startsWith('data:')) ? img : `assets/${img}.jpg`, icon, name, desc, href: `products.dc.html?cat=${k}`, meta: `${fa(subs.length)} زیرگروه`,
        subs: subs.map(s => ({ label: s, href: `products.dc.html?cat=${k}&sub=${encodeURIComponent(s)}` }))
      })),
      steps: [
        { icon: 'category', title: 'انتخاب دسته', desc: 'دسته و زیرگروه مصالح مورد نیاز را انتخاب کنید.' },
        { icon: 'receipt-2', title: 'استعلام قیمت', desc: 'قیمت روز را آنلاین یا تلفنی دریافت کنید.' },
        { icon: 'clipboard-check', title: 'ثبت سفارش', desc: 'مقدار و محل تحویل را هماهنگ کنید.' },
        { icon: 'truck-delivery', title: 'تحویل در محل', desc: 'بار شما در کوتاه‌ترین زمان به کارگاه می‌رسد.' }
      ].map((s, i) => ({ ...s, n: fa(i + 1) })),
      spot: e => { const r = e.currentTarget.getBoundingClientRect(); e.currentTarget.style.setProperty('--mx', (e.clientX - r.left) + 'px'); e.currentTarget.style.setProperty('--my', (e.clientY - r.top) + 'px'); },
      consult: () => window.dispatchEvent(new CustomEvent('hm:consult', { detail: {} }))
    };
  }
}
</script>
</body>
</html>
