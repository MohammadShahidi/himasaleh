<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
[data-rs-b]{transition:background-color .3s,color .3s,transform .25s cubic-bezier(.2,.8,.2,1);cursor:pointer;}
[data-rs-b]:active{transform:scale(.95);}
[data-rs-b][data-active="1"]{background:#FF5B0F !important;color:#fff !important;box-shadow:0 8px 20px rgba(255,91,15,.35);}
[data-rs-row]::-webkit-scrollbar{display:none;}
</style>
</helmet>
<sc-if value="{{ show }}" hint-placeholder-val="{{ false }}">
  <div dir="rtl" style="font-family:'Vazirmatn',Tahoma,sans-serif;background:#141414;color:#fff;border-radius:{{ radius }};padding:8px;display:flex;align-items:center;gap:8px;">
    <span style="flex:none;display:flex;align-items:center;gap:6px;padding:0 6px 0 4px;font-size:13px;font-weight:800;color:#BBB;white-space:nowrap;"><i class="ti ti-switch-horizontal" style="font-size:18px;color:#FF8A4F;"></i>نقش من</span>
    <div data-rs-row="" style="flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;">
      <sc-for list="{{ roles }}" as="r" hint-placeholder-count="2">
        <button data-rs-b="" data-active="{{ r.a }}" onClick="{{ r.go }}" aria-current="{{ r.cur }}" style="flex:1 0 auto;min-height:52px;border:none;border-radius:14px;background:rgba(255,255,255,.08);color:#DDD;padding:6px 14px;font-family:inherit;font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;">
          <i class="ti ti-{{ r.icon }}" style="font-size:22px;"></i>{{ r.t }}
          <sc-if value="{{ r.isCur }}" hint-placeholder-val="{{ false }}"><i class="ti ti-check" style="font-size:16px;"></i></sc-if>
        </button>
      </sc-for>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;520px&quot;,&quot;height&quot;:&quot;80px&quot;},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;personal&quot;,&quot;contractor&quot;,&quot;driver&quot;,&quot;supplier&quot;,&quot;admin&quot;],&quot;default&quot;:&quot;contractor&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;radius&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;18px&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  MAP = { personal: ['user', 'شخصی', 'panel.dc.html?role=personal'], contractor: ['helmet', 'پیمانکار', 'panel.dc.html?role=contractor'], driver: ['steering-wheel', 'راننده', 'driver-panel.dc.html'], supplier: ['building-store', 'مصالح‌فروش', 'supplier-panel.dc.html'], admin: ['shield-lock', 'مدیریت', 'admin.dc.html'] };
  // Demo fallback only — remove in production; roles come from the account.
  DEMO = { admin: ['admin', 'contractor'], other: ['contractor', 'driver', 'supplier'] };
  state = { u: null };
  componentDidMount() { let u = {}; try { u = JSON.parse(localStorage.getItem('hm_user') || '{}'); } catch (e) {} this.setState({ u }); }
  renderVals() {
    const u = this.state.u || {}, cur = this.props.current ?? u.role ?? 'contractor';
    let roles = Array.isArray(u.roles) && u.roles.length ? u.roles.slice() : (cur === 'admin' ? this.DEMO.admin : this.DEMO.other).slice();
    if (!roles.includes(cur)) roles.unshift(cur);
    roles = roles.filter(k => this.MAP[k]);
    return {
      show: roles.length > 1, radius: this.props.radius ?? '18px',
      roles: roles.map(k => { const [icon, t, href] = this.MAP[k]; const isCur = k === cur;
        return { icon, t, isCur, a: isCur ? '1' : '0', cur: isCur ? 'true' : 'false',
          go: () => { if (isCur) return; try { localStorage.setItem('hm_user', JSON.stringify({ ...u, roles, role: k })); } catch (e) {} location.href = href; } }; })
    };
  }
}
</script>
</body>
</html>
