# Local development: database and S3-compatible storage only.
# Run the apps on the host with `pnpm dev:api` and `pnpm dev:web`.
name: himasaleh-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hm
      POSTGRES_PASSWORD: hm
      POSTGRES_DB: hm
    ports: ["5432:5432"]
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hm"]
      interval: 3s
      retries: 20

  # SeaweedFS speaks S3. (MinIO no longer publishes community Docker images.)
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports: ["8333:8333"]
    volumes:
      - s3:/data
      - ./seaweedfs-s3.dev.json:/etc/seaweedfs/s3.json:ro

volumes:
  pg:
  s3:
